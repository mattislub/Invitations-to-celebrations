<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BestRegards logo</title>
  <desc id="desc">A navy fountain pen drawing a flowing line that forms the text BestRegards</desc>
  <defs>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2B4C" />
      <stop offset="45%" stop-color="#1E3E63" />
      <stop offset="100%" stop-color="#0A172B" />
    </linearGradient>
    <linearGradient id="penHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FB2D9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#F7F9FC" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1F2E4A" />
      <stop offset="100%" stop-color="#30466B" />
    </linearGradient>
    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0A1020" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#penShadow)" transform="translate(36 20) rotate(-16 80 80)">
    <rect x="10" y="46" width="190" height="34" rx="17" fill="url(#penBody)" />
    <rect x="18" y="52" width="170" height="20" rx="10" fill="url(#penHighlight)" opacity="0.65" />
    <rect x="120" y="46" width="18" height="34" fill="#C3CCD8" opacity="0.85" />
    <rect x="138" y="46" width="10" height="34" fill="#0A172B" opacity="0.65" />
    <rect x="206" y="46" width="22" height="34" rx="3" fill="#0B1120" />
    <rect x="228" y="46" width="20" height="34" rx="4" fill="#C3CCD8" opacity="0.8" />
    <polygon points="248,63 278,52 278,74" fill="#1F2E4A" />
    <polygon points="248,63 266,52 266,74" fill="#C9D3DD" opacity="0.95" />
    <polygon points="278,52 286,63 278,74" fill="#0A172B" />
    <circle cx="210" cy="63" r="4.5" fill="#F7F9FC" opacity="0.95" />
  </g>
  <path d="M136 142c60-16 92-32 150-32 52 0 82 14 146 12 62-2 84-20 122-12 24 5 34 18 22 30-18 18-64 18-94 6" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="168" y="124" fill="#0F1F39" font-family="'Playfair Display','Segoe Script',cursive" font-size="72" font-weight="600">BestRegards</text>
</svg>

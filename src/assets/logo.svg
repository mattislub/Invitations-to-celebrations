<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BestRegards wordmark</title>
  <desc id="desc">A navy fountain pen followed by the words Best Regards in flowing script with a flourish</desc>
  <defs>
    <linearGradient id="logoPenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e2448" />
      <stop offset="55%" stop-color="#1f4d83" />
      <stop offset="100%" stop-color="#0a162c" />
    </linearGradient>
    <linearGradient id="logoPenHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bbd0ea" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f5f8fc" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="logoPenNib" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9e4f2" />
      <stop offset="100%" stop-color="#9fb2cd" />
    </linearGradient>
    <filter id="penShadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0a0f20" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#penShadow)" transform="translate(42 32) rotate(-18 110 90)">
    <rect x="8" y="62" width="150" height="30" rx="15" fill="url(#logoPenBody)" />
    <rect x="18" y="67" width="124" height="18" rx="9" fill="url(#logoPenHighlight)" opacity="0.75" />
    <rect x="112" y="62" width="11" height="30" rx="3" fill="#dce3ef" />
    <rect x="123" y="62" width="10" height="30" rx="3" fill="#0d1d34" opacity="0.85" />
    <rect x="152" y="62" width="20" height="30" rx="4" fill="#0b1220" />
    <rect x="172" y="62" width="16" height="30" rx="4" fill="#d6dfe9" opacity="0.9" />
    <polygon points="188,77 180,62 180,92" fill="#102649" />
    <polygon points="172,62 184,77 172,92" fill="url(#logoPenNib)" />
    <circle cx="158" cy="77" r="3.5" fill="#f7f9fc" opacity="0.92" />
    <path d="M8 78 Q -12 74 -30 56" stroke="#0b1b34" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
  <path d="M208 148 C 240 148 268 154 310 170 C 370 193 398 204 446 204 C 490 204 512 192 530 178 C 566 148 598 132 642 132 C 694 132 726 156 740 184 C 756 216 734 240 702 238 C 670 236 646 206 672 194 C 700 180 772 189 812 210 C 836 222 854 234 880 232" stroke="#0e2448" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="220" y="150" fill="#102748" font-family="'Great Vibes','Pacifico','Segoe Script','Brush Script MT',cursive" font-size="104" font-weight="600" letter-spacing="1">Best Regards</text>
</svg>

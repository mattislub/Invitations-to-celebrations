<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BestRegards pen icon</title>
  <desc id="desc">A navy fountain pen on a white background</desc>
  <defs>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f264c" />
      <stop offset="55%" stop-color="#1f4e82" />
      <stop offset="100%" stop-color="#0b1831" />
    </linearGradient>
    <linearGradient id="penHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6cde8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f3f7fc" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="penNib" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7e1f0" />
      <stop offset="100%" stop-color="#9fb4d3" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a0f1f" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="translate(10 16) rotate(-20 52 52)">
    <rect x="6" y="40" width="90" height="24" rx="12" fill="url(#penBody)" />
    <rect x="14" y="44" width="74" height="14" rx="7" fill="url(#penHighlight)" opacity="0.75" />
    <rect x="64" y="40" width="11" height="24" rx="3" fill="#dbe3f1" />
    <rect x="75" y="40" width="9" height="24" rx="3" fill="#0c1b30" opacity="0.8" />
    <rect x="95" y="40" width="16" height="24" rx="3" fill="#0b1220" />
    <rect x="111" y="40" width="14" height="24" rx="4" fill="#d7dfe9" opacity="0.9" />
    <polygon points="125,52 116,40 116,64" fill="#0f264c" />
    <polygon points="111,40 120,52 111,64" fill="url(#penNib)" />
    <circle cx="100" cy="52" r="3" fill="#f7f9fc" opacity="0.9" />
    <path d="M6 53 q-8 -2 -12 -10" stroke="#0b1a33" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>
